<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/Gallery</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/gallerycss.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptGal.js"></script>
</head>
<body>
    <header class="fl-header">
        <div class="fl-header-inner">
            <div class="fl-logo" onclick="kehome()">
                <img src="css/Asset/florism.jpeg" alt="Florism">
                <span>florism.</span>
            </div>
            <div class="fl-search">
                <input type="text" id="searchBarWisata" placeholder="Cari destinasi wisata...">
                <button onclick="searchWisata()">Cari</button>
            </div>
            <ul class="fl-nav">
                <li><button onclick="kekeranjang()">Keranjang</button></li>
                <li><button onclick="ketiket()">Ticket</button></li>
                <li><button onclick="kegallery()">Gallery</button></li>
                <li><button onclick="keprofile()">Profile</button></li>
                <li><button class="fl-btn-outline" id="logout" onclick="kelogout()">Logout</button></li>
            </ul>
        </div>
    </header>

    <main class="fl-page">
        <section class="fl-container section">
            <h1 class="section-title">Jelajahi Destinasi</h1>
            <div id="galleryGrid" class="gallery-grid"></div>
            <div id="searchNotFound" class="empty-state"></div>
        </section>
    </main>

    <div id="masking" class="fl-overlay"></div>

    <div id="keran" class="fl-drawer">
        <img class="fl-drawer-close" onclick="kluar()" src="css/Asset/reject.png" alt="Tutup">
        <h2>Keranjang Tiket Anda</h2>
        <div class="cart-table-wrap">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Tanggal</th>
                        <th>Jumlah</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tbodykeranjang"></tbody>
            </table>
        </div>
        <button class="fl-btn fl-btn-primary fl-btn-block" onclick="bayar()" id="tombol">Pembayaran</button>
    </div>
</body>
</html>
