<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/dev.css">
    <script src="js/auth.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="isian">
    <h1>Florism Dashboard</h1>
    <div class="row">
    <div class="data">
    <h3>Data Gallery</h3>
    <h4>Foto Wisata (URL) :</h4>
    <input id="devFoto" type="text" oninput="updatePreview()">
    <h4>Nama Wisata :</h4>
    <input id="devNama" type="text">
    <h4>Rating :</h4>
    <input id="devRating" type="text">
    <h4>Harga :</h4>
    <input id="devHarga" type="text">
    <h4>Link Lokasi :</h4>
    <input id="devLokasi" type="text">
    </div>
    <div class="photo">
    <img id="devPreviewImg" src="css/Asset/kulon.jpg">
    <h3 id="preview">Preview</h3>
    <button onclick="tambahData()">Tambah Data</button>
    </div>
    </div>

    <div class="row" id="daftarData" style="margin-top:20px; flex-direction: column; display:none;">
        <h3>Data Yang Sudah Ditambahkan</h3>
        <div id="listData"></div>
    </div>
</div>
<script src="js/scriptDev.js"></script>
</body>
</html>
