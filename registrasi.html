<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/Registrasi</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/regcss.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptReg.js"></script>
</head>
<body>
    <header class="fl-header">
        <div class="fl-header-inner">
            <div class="fl-logo" onclick="window.location.href='gallery.html'">
                <img src="css/Asset/florism.jpeg" alt="Florism">
                <span>florism.</span>
            </div>
        </div>
    </header>

    <main class="fl-page">
        <section class="fl-container section">
            <div class="pay-card">
                <div class="pay-form">
                    <h1>Lanjutkan Pembayaran</h1>

                    <div class="fl-field">
                        <label for="nama">Nama</label>
                        <input id="nama" type="text" placeholder="Nama lengkap">
                    </div>
                    <div class="fl-field">
                        <label for="email">Email</label>
                        <input id="email" type="text" placeholder="nama@email.com">
                    </div>
                    <div class="fl-field">
                        <label for="nohp">No Handphone</label>
                        <input id="nohp" type="text" placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="fl-field">
                        <label for="totalhg">Total Harga</label>
                        <input type="text" id="totalhg" readonly>
                    </div>

                    <div class="pay-actions">
                        <button id="signin" class="fl-btn fl-btn-primary" onclick="pembayaran()">Bayar</button>
                        <button class="fl-btn fl-btn-outline" onclick="pesanan()">Kembali</button>
                    </div>
                </div>
                <div class="pay-banner">
                    <h2>Jelajahi Wisata Alam Di Sekitarmu Bersama Florism</h2>
                </div>
            </div>
        </section>
    </main>

    <div id="masking" class="fl-overlay"></div>
    <div id="notifp" class="fl-confirm">
        <h2>Berhasil Dipesan</h2>
        <button class="fl-btn fl-btn-primary fl-btn-block" onclick="kembali()">Lihat Pesanan</button>
    </div>
</body>
<script>
async function pembayaran(){
    const nama = document.getElementById('nama').value.trim();
    const email = document.getElementById('email').value.trim();
    const nohp = document.getElementById('nohp').value.trim();

    if (!nama) {
        alert("Nama wajib diisi.");
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert("Email tidak valid.");
        return;
    }
    if (!/^[0-9]{8,15}$/.test(nohp)) {
        alert("No Handphone harus berupa angka (8-15 digit).");
        return;
    }

    await supabaseClient.from('cart_items').delete().eq('user_id', currentUser.id);

    document.getElementById('masking').classList.add('is-open');
    document.getElementById('notifp').classList.add('is-open');
}

function kembali(){
    window.location.href=("tiket.html")
}
</script>
</html>
