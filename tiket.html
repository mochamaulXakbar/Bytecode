<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/Tiket</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/tiketcss.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptTik.js"></script>
    <script src="js/reveal.js"></script>
</head>
<body>
    <header class="fl-header">
        <div class="fl-header-inner">
            <div class="fl-logo" onclick="kehome()">
                <img src="css/Asset/florism.jpeg" alt="Florism">
                <span>florism.</span>
            </div>
            <ul class="fl-nav">
                <li><button onclick="ketiket()">Ticket</button></li>
                <li><button onclick="kegallery()">Gallery</button></li>
                <li><button onclick="keprofile()">Profile</button></li>
                <li><button class="fl-btn-outline" id="logout" onclick="kelogout()">Logout</button></li>
            </ul>
        </div>
    </header>

    <main class="fl-page">
        <section class="fl-container section">
            <h1 class="section-title reveal">Pesanan Anda</h1>

            <div class="order-card reveal">
                <div class="order-table-wrap">
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>Nama</th>
                                <th>Tanggal</th>
                                <th>Jumlah</th>
                                <th>Harga</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPesanan"></tbody>
                    </table>
                </div>
                <div id="pesananKosong" class="empty-state" style="display:none;">
                    <img src="css/Asset/ayam.png" alt="Belum ada pesanan">
                    <p>Belum ada pesanan tiket.</p>
                    <button class="fl-btn fl-btn-primary" onclick="kegallery()">Jelajahi Wisata</button>
                </div>
            </div>
        </section>
    </main>
</body>
<script>
    async function tampilkanPesanan() {
        const user = await requireLogin();
        if (!user) return;

        var tbody = document.getElementById("tbodyPesanan");
        const { data, error } = await supabaseClient
            .from('cart_items')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: true });

        var keranjang = error ? [] : data;

        if (keranjang.length === 0) {
            document.querySelector('.order-table-wrap').style.display = "none";
            document.getElementById("pesananKosong").style.display = "flex";
            return;
        }

        keranjang.forEach(function (tiket) {
            var row = tbody.insertRow();
            row.insertCell(0).innerHTML = tiket.nama_wisata;
            row.insertCell(1).innerHTML = tiket.tanggal;
            row.insertCell(2).innerHTML = tiket.jumlah;
            row.insertCell(3).innerHTML = tiket.harga;
        });
    }

    tampilkanPesanan();
</script>
</html>
