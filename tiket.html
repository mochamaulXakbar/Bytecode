<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florism/Tiket</title>
    <link rel="stylesheet" type="text/css" href="css/tiketcss.css">
    <script src="js/auth.js"></script>
    <script src="js/scriptTik.js"></script>
</head>
<body>
    <header>
        <img src="css/Asset/florism.jpeg" alt="Florism">
        <ul>
            <li><button onclick="ketiket()">Ticket</button></li>
            <li><button onclick="kegallery()">Gallery</button></li>
            <li><button onclick="keprofile()">Profile</button></li>
            <li><button id="logout" onclick="kelogout()">Logout</button></li>
        </ul>
    </header>
    <div id="konten" class="konten">
        <h1>Pesanan Anda </h1>
        <div class="keranjang">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Tanggal</th>
                        <th>Jumlah</th>
                        <th>Harga</th>
                    </tr>
                </thead>
                <tbody id="tbodyPesanan">
                </tbody>
            </table>
        </div>
        <p id="pesananKosong" style="display:none;">Belum ada pesanan tiket.</p>
        <img src="css/Asset/ayam.png" alt="Ilustrasi tiket">
    </div>
</body>
<script>
    function tampilkanPesanan() {
        var tbody = document.getElementById("tbodyPesanan");
        var keranjang = JSON.parse(localStorage.getItem('keranjangTiket')) || [];

        if (keranjang.length === 0) {
            document.getElementById("pesananKosong").style.display = "block";
            return;
        }

        keranjang.forEach(function (tiket) {
            var row = tbody.insertRow();
            row.insertCell(0).innerHTML = tiket.namaWisata;
            row.insertCell(1).innerHTML = tiket.tanggal;
            row.insertCell(2).innerHTML = tiket.jumlah;
            row.insertCell(3).innerHTML = tiket.harga;
        });
    }

    tampilkanPesanan();
</script>
</html>
