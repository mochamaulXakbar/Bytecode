<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/PemesananTiket</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/formtiket.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptForm.js"></script>
</head>
<body>
    <header class="fl-header">
        <div class="fl-header-inner">
            <div class="fl-logo" onclick="window.location.href='gallery.html'">
                <img src="css/Asset/florism.jpeg" alt="Florism">
                <span>florism.</span>
            </div>
        </div>
    </header>

    <main class="fl-page">
        <section class="fl-container section">
            <div class="booking-card">
                <div class="booking-form">
                    <h1>Selesaikan Pemesanan Anda</h1>

                    <div class="fl-field">
                        <label for="namwis">Wisata</label>
                        <input id="namwis" type="text" name="namwis" readonly>
                    </div>
                    <div class="fl-field">
                        <label for="Tanggal">Tanggal</label>
                        <input id="Tanggal" type="date">
                    </div>
                    <div class="fl-field">
                        <label for="jumlahTiket">Jumlah Tiket</label>
                        <input type="number" id="jumlahTiket" name="jumlahTiket" value="1" min="1" required>
                    </div>
                    <div class="fl-field">
                        <label for="harga">Harga</label>
                        <input id="harga" type="text" name="harga" readonly>
                    </div>

                    <div class="booking-actions">
                        <button class="fl-btn fl-btn-outline" id="charga" onclick="cekharga()">Cek Harga</button>
                        <button class="fl-btn fl-btn-primary" type="button" onclick="tambahTiket()">Tambah Ke Keranjang</button>
                    </div>
                </div>
                <div class="booking-media">
                    <img id="fotobg" alt="Foto Wisata">
                </div>
            </div>
        </section>
    </main>

    <div id="masking" class="fl-overlay"></div>
    <div id="notifp" class="fl-confirm">
        <h2>Berhasil Ditambahkan</h2>
        <button class="fl-btn fl-btn-primary fl-btn-block" onclick="kembali()">Kembali</button>
    </div>
</body>
<script>
    function kembali(){
        window.location.href=("gallery.html")
    }

    async function tambahTiket() {
        var namaWisata = document.getElementById("namwis").value;
        var tanggal = document.getElementById("Tanggal").value;
        var jumlah = document.getElementById("jumlahTiket").value;
        var harga = document.getElementById("harga").value;

        if (!tanggal) {
            alert("Silakan pilih tanggal kunjungan.");
            return;
        }
        if (!jumlah || parseInt(jumlah) < 1) {
            alert("Jumlah tiket tidak valid.");
            return;
        }
        if (!harga || isNaN(parseFloat(harga))) {
            alert("Silakan cek harga terlebih dahulu.");
            return;
        }

        const { error } = await supabaseClient.from('cart_items').insert({
            user_id: currentUser.id,
            nama_wisata: namaWisata,
            tanggal: tanggal,
            jumlah: parseInt(jumlah),
            harga: parseFloat(harga)
        });

        if (error) {
            alert("Gagal menambahkan ke keranjang: " + error.message);
            return;
        }

        document.getElementById('masking').classList.add('is-open');
        document.getElementById('notifp').classList.add('is-open');
    }
</script>
</html>
