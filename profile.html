<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/Profile</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/profile.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptProfile.js"></script>
</head>
<body>
    <header class="fl-header">
        <div class="fl-header-inner">
            <div class="fl-logo" onclick="kehome()">
                <img src="css/Asset/florism.jpeg" alt="Florism">
                <span>florism.</span>
            </div>
            <ul class="fl-nav">
                <li><button onclick="ketiket()">Ticket</button></li>
                <li><button onclick="kegallery()">Gallery</button></li>
                <li><button onclick="keprofile()">Profile</button></li>
                <li><button class="fl-btn-outline" id="logout" onclick="kelogout()">Logout</button></li>
            </ul>
        </div>
    </header>

    <main class="fl-page">
        <div class="profile-card">
            <h1>Profile</h1>
            <div class="profile-pic">
                <img src="css/Asset/Profile.jpg" alt="Foto Profil">
            </div>
            <div class="details">
                <div class="fl-field">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" value="" placeholder="Nama lengkap">
                </div>
                <div class="fl-field">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" value="" placeholder="nama@email.com">
                </div>
                <div class="fl-field">
                    <label for="phone">No Handphone</label>
                    <input type="text" id="phone" name="phone" value="" placeholder="08xxxxxxxxxx">
                </div>
                <div class="fl-field">
                    <label for="gender">Jenis Kelamin</label>
                    <input type="text" id="gender" name="gender" value="" placeholder="Laki-laki / Perempuan">
                </div>
                <button class="fl-btn fl-btn-primary fl-btn-block" onclick="saveProfile()">Save Details</button>
            </div>
        </div>
    </main>
</body>
</html>
