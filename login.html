<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="css/Asset/florism.jpeg">
    <title>Florism/Login</title>
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/gaya.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/scriptLog.js"></script>
</head>
<body>
    <main class="fl-page login-page">
        <div class="login-card">
            <img src="css/Asset/florism.jpeg" alt="Florism">
            <h1>Welcome To Florism</h1>
            <p class="login-sub">Please sign in to continue</p>
            <div class="fl-field">
                <input id="login-username" type="text" placeholder="Username">
            </div>
            <div class="fl-field">
                <input id="login-password" type="password" placeholder="Password">
            </div>
            <button id="login" class="fl-btn fl-btn-primary fl-btn-block" onclick="hasil()">Login</button>
            <p class="login-alt">Belum Punya Akun? <button id="signup" class="link-btn" onclick="signup()">Sign Up</button></p>
        </div>
    </main>
</body>
</html>
